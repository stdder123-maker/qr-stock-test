<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>
ESP32 Control
</title>


<script
src="https://unpkg.com/mqtt/dist/mqtt.min.js">
</script>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  padding: 25px 15px;

  font-family:
  Arial,
  Tahoma,
  sans-serif;

  background:
  #0f172a;

  color:
  white;

}


.container {

  max-width:
  500px;

  margin:
  auto;

}


h1 {

  text-align:
  center;

  margin-bottom:
  5px;

}


.subtitle {

  text-align:
  center;

  color:
  #94a3b8;

  margin-bottom:
  25px;

}


.card {

  background:
  #1e293b;

  border:
  1px solid #334155;

  border-radius:
  18px;

  padding:
  20px;

  margin-bottom:
  15px;

}


.connection-row {

  display:
  flex;

  justify-content:
  space-between;

  align-items:
  center;

}


.label {

  color:
  #94a3b8;

  font-size:
  13px;

  margin-bottom:
  8px;

}


.connection {

  display:
  flex;

  align-items:
  center;

  gap:
  8px;

  font-weight:
  bold;

}


.dot {

  width:
  11px;

  height:
  11px;

  border-radius:
  50%;

  background:
  #64748b;

}


.dot.online {

  background:
  #22c55e;

}


.dot.offline {

  background:
  #ef4444;

}


.dot.connecting {

  background:
  #f59e0b;

}


/* OUTPUT */

.light-row {

  display:
  grid;

  grid-template-columns:
  1fr 80px 145px;

  gap:
  10px;

  align-items:
  center;

}


.light-name {

  font-size:
  20px;

  font-weight:
  bold;

}


.status {

  text-align:
  center;

  font-size:
  20px;

  font-weight:
  bold;

  color:
  #94a3b8;

}


.status.on {

  color:
  #22c55e;

}


.status.off {

  color:
  #ef4444;

}


/* BUTTON */

.toggle-button {

  border:
  none;

  border-radius:
  14px;

  padding:
  16px 10px;

  font-size:
  17px;

  font-weight:
  bold;

  cursor:
  pointer;

  background:
  #475569;

  color:
  white;

}


.toggle-button.turn-on {

  background:
  #22c55e;

}


.toggle-button.turn-off {

  background:
  #ef4444;

}


.toggle-button:disabled {

  opacity:
  0.4;

  cursor:
  not-allowed;

}


/* LOGIN */

input {

  width:
  100%;

  padding:
  14px;

  margin-bottom:
  10px;

  border-radius:
  12px;

  border:
  1px solid #475569;

  background:
  #0f172a;

  color:
  white;

  font-size:
  16px;

}


.connect-button {

  width:
  100%;

  border:
  none;

  border-radius:
  14px;

  padding:
  16px;

  font-size:
  18px;

  font-weight:
  bold;

  background:
  #3b82f6;

  color:
  white;

  cursor:
  pointer;

}


.disconnect-button {

  width:
  100%;

  border:
  none;

  border-radius:
  14px;

  padding:
  16px;

  margin-top:
  10px;

  font-size:
  18px;

  font-weight:
  bold;

  background:
  #475569;

  color:
  white;

  cursor:
  pointer;

}


button:disabled {

  opacity:
  0.4;

}


.log {

  background:
  #0f172a;

  padding:
  12px;

  border-radius:
  12px;

  min-height:
  100px;

  font-family:
  Consolas,
  monospace;

  font-size:
  12px;

  color:
  #cbd5e1;

  white-space:
  pre-wrap;

  overflow-wrap:
  anywhere;

}


@media
(max-width: 450px) {

  .light-row {

    grid-template-columns:
    1fr 60px 120px;

  }


  .light-name {

    font-size:
    17px;

  }


  .toggle-button {

    font-size:
    14px;

  }

}

</style>

</head>


<body>


<div class="container">


<h1>
ESP32 CONTROL
</h1>


<div class="subtitle">
3 Independent Outputs
</div>



<!-- CONNECTION -->

<div class="card">


<div class="connection-row">


<div>

<div class="label">
MQTT CONNECTION
</div>


<div class="connection">

<span
id="connDot"
class="dot">
</span>


<span id="connText">
Disconnected
</span>

</div>

</div>


<div style="text-align:right">

<div class="label">
DEVICE
</div>

<strong>
ESP01
</strong>

</div>


</div>


</div>



<!-- LIGHT 1 -->

<div class="card">


<div class="light-row">


<div class="light-name">
LIGHT 1
</div>


<div
id="status1"
class="status">
---
</div>


<button
id="button1"
class="toggle-button control-button"
onclick="toggleLight(1)"
disabled>

WAIT

</button>


</div>


</div>



<!-- LIGHT 2 -->

<div class="card">


<div class="light-row">


<div class="light-name">
LIGHT 2
</div>


<div
id="status2"
class="status">
---
</div>


<button
id="button2"
class="toggle-button control-button"
onclick="toggleLight(2)"
disabled>

WAIT

</button>


</div>


</div>



<!-- LIGHT 3 -->

<div class="card">


<div class="light-row">


<div class="light-name">
LIGHT 3
</div>


<div
id="status3"
class="status">
---
</div>


<button
id="button3"
class="toggle-button control-button"
onclick="toggleLight(3)"
disabled>

WAIT

</button>


</div>


</div>



<!-- LOGIN -->

<div class="card">


<div class="label">
MQTT LOGIN
</div>


<input
id="username"
type="text"
value="esp01"
placeholder="Username">


<input
id="password"
type="password"
placeholder="HiveMQ Password">


<button
id="connectButton"
class="connect-button"
onclick="connectMQTT()">

Connect

</button>


<button
id="disconnectButton"
class="disconnect-button"
onclick="disconnectMQTT()"
disabled>

Disconnect

</button>


</div>



<!-- LOG -->

<div class="card">


<div class="label">
SYSTEM LOG
</div>


<div
id="log"
class="log">

Ready.

</div>


</div>


</div>



<script>


// =====================================================
// HIVEMQ
// =====================================================

const MQTT_HOST =
"380dfaf330224340913625c3fd2802b8.s1.eu.hivemq.cloud";


const MQTT_PORT =
8884;



// =====================================================
// TOPICS
// =====================================================

const COMMAND_TOPICS = {

  1:
  "factory/esp01/light1/command",

  2:
  "factory/esp01/light2/command",

  3:
  "factory/esp01/light3/command"

};


const STATUS_TOPICS = {

  1:
  "factory/esp01/light1/status",

  2:
  "factory/esp01/light2/status",

  3:
  "factory/esp01/light3/status"

};



// =====================================================
// VARIABLES
// =====================================================

let client =
null;


let manualDisconnect =
false;


let lightState = {

  1:
  null,

  2:
  null,

  3:
  null

};



// =====================================================
// LOG
// =====================================================

function log(
  message
) {


  const time =
  new Date()
  .toLocaleTimeString();


  const box =
  document
  .getElementById(
    "log"
  );


  box.textContent =

  "[" +
  time +
  "] " +
  message +
  "\n" +
  box.textContent;

}



// =====================================================
// CONNECTION DISPLAY
// =====================================================

function setConnection(
  state,
  text
) {


  const dot =
  document
  .getElementById(
    "connDot"
  );


  const label =
  document
  .getElementById(
    "connText"
  );


  dot.className =
  "dot " +
  state;


  label.textContent =
  text;


  document
  .getElementById(
    "connectButton"
  )
  .disabled =

  state ===
  "online" ||

  state ===
  "connecting";


  document
  .getElementById(
    "disconnectButton"
  )
  .disabled =

  state !==
  "online";

}



// =====================================================
// STATUS DISPLAY
// =====================================================

function setLightStatus(
  number,
  message
) {


  const msg =
  message
  .trim()
  .toUpperCase();


  if (
    msg !== "ON" &&
    msg !== "OFF"
  ) {

    return;

  }


  lightState[
    number
  ] =
  msg;


  const status =
  document
  .getElementById(
    "status" +
    number
  );


  const button =
  document
  .getElementById(
    "button" +
    number
  );


  status.textContent =
  msg;


  button.disabled =
  false;


  if (
    msg === "ON"
  ) {


    status.className =
    "status on";


    button.className =
    "toggle-button control-button turn-off";


    button.textContent =
    "TURN OFF";

  }


  else {


    status.className =
    "status off";


    button.className =
    "toggle-button control-button turn-on";


    button.textContent =
    "TURN ON";

  }

}



// =====================================================
// CONNECT MQTT
// =====================================================

function connectMQTT() {


  const username =
  document
  .getElementById(
    "username"
  )
  .value
  .trim();


  const password =
  document
  .getElementById(
    "password"
  )
  .value;


  if (
    !username ||
    !password
  ) {


    alert(
      "กรุณากรอก Username และ Password"
    );


    return;

  }



  if (
    client
  ) {


    try {

      client.end(
        true
      );

    }

    catch(e) {}


    client =
    null;

  }



  manualDisconnect =
  false;


  setConnection(
    "connecting",
    "Connecting..."
  );


  log(
    "Connecting HiveMQ..."
  );



  const url =

  "wss://" +
  MQTT_HOST +
  ":" +
  MQTT_PORT +
  "/mqtt";



  client =
  mqtt.connect(
    url,
    {


      username:
      username,


      password:
      password,


      clientId:

      "WEB_" +
      Date.now() +
      "_" +
      Math.random()
      .toString(16)
      .slice(2,8),


      clean:
      true,


      keepalive:
      30,


      connectTimeout:
      15000,


      reconnectPeriod:
      5000,


      resubscribe:
      true

    }
  );



  // =================================================
  // CONNECT
  // =================================================

  client.on(
    "connect",
    function() {


      setConnection(
        "online",
        "Connected"
      );


      log(
        "MQTT Connected"
      );



      client.subscribe(

        [
          STATUS_TOPICS[1],
          STATUS_TOPICS[2],
          STATUS_TOPICS[3]
        ],

        {
          qos:
          0
        },

        function(error) {


          if (
            error
          ) {


            log(
              "Subscribe Error: " +
              error.message
            );

          }


          else {


            log(
              "Subscribed LIGHT 1 / 2 / 3"
            );

          }

        }

      );

    }

  );



  // =================================================
  // RECEIVE MESSAGE
  // =================================================

  client.on(
    "message",
    function(
      topic,
      payload
    ) {


      const message =
      payload.toString();


      log(

        "RX " +
        topic +
        " = " +
        message

      );



      if (
        topic ===
        STATUS_TOPICS[1]
      ) {


        setLightStatus(
          1,
          message
        );

      }



      else if (
        topic ===
        STATUS_TOPICS[2]
      ) {


        setLightStatus(
          2,
          message
        );

      }



      else if (
        topic ===
        STATUS_TOPICS[3]
      ) {


        setLightStatus(
          3,
          message
        );

      }

    }

  );



  // =================================================
  // RECONNECT
  // =================================================

  client.on(
    "reconnect",
    function() {


      if (
        manualDisconnect
      ) {

        return;

      }


      setConnection(
        "connecting",
        "Reconnecting..."
      );


      log(
        "Reconnecting..."
      );

    }

  );



  // =================================================
  // OFFLINE
  // =================================================

  client.on(
    "offline",
    function() {


      if (
        manualDisconnect
      ) {

        return;

      }


      setConnection(
        "connecting",
        "Reconnecting..."
      );

    }

  );



  // =================================================
  // ERROR
  // =================================================

  client.on(
    "error",
    function(error) {


      log(
        "MQTT Error: " +
        error.message
      );


      if (
        !manualDisconnect
      ) {


        setConnection(
          "connecting",
          "Reconnecting..."
        );

      }

    }

  );

}



// =====================================================
// DISCONNECT
// =====================================================

function disconnectMQTT() {


  manualDisconnect =
  true;


  if (
    client
  ) {


    client.end(
      true
    );


    client =
    null;

  }


  setConnection(
    "offline",
    "Disconnected"
  );


  log(
    "Disconnected"
  );

}



// =====================================================
// TOGGLE LIGHT
// =====================================================

function toggleLight(
  number
) {


  if (
    !client ||
    !client.connected
  ) {


    alert(
      "MQTT ยังไม่ได้เชื่อมต่อ"
    );


    return;

  }



  if (
    lightState[
      number
    ] === null
  ) {


    alert(
      "ยังไม่ได้รับสถานะจาก ESP32"
    );


    return;

  }



  const command =

  lightState[
    number
  ] === "ON"

  ?

  "OFF"

  :

  "ON";



  const topic =
  COMMAND_TOPICS[
    number
  ];



  log(

    "TX LIGHT " +
    number +
    " = " +
    command

  );



  client.publish(
    topic,
    command,
    {

      qos:
      0,

      retain:
      false

    },

    function(error) {


      if (
        error
      ) {


        log(
          "Publish Error: " +
          error.message
        );

      }

    }

  );

}



// =====================================================
// START
// =====================================================

setConnection(
  "offline",
  "Disconnected"
);


</script>


</body>

</html>
