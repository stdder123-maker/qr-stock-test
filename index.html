<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ESP32 Control</title>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #0f172a;
      color: white;
      padding: 25px 15px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 25px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .connection-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .label {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .connection {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #64748b;
    }

    .dot.online {
      background: #22c55e;
    }

    .dot.offline {
      background: #ef4444;
    }

    .dot.connecting {
      background: #f59e0b;
    }

    .light-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .status {
      text-align: center;
      font-size: 38px;
      font-weight: bold;
      margin: 20px 0;
      color: #94a3b8;
    }

    .status.on {
      color: #22c55e;
    }

    .status.off {
      color: #ef4444;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 17px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-on {
      background: #22c55e;
      color: white;
    }

    .btn-off {
      background: #ef4444;
      color: white;
    }

    .btn-connect {
      width: 100%;
      background: #3b82f6;
      color: white;
      margin-top: 5px;
    }

    .btn-disconnect {
      width: 100%;
      background: #475569;
      color: white;
      margin-top: 10px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 12px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 16px;
    }

    .log {
      background: #0f172a;
      padding: 12px;
      border-radius: 12px;
      min-height: 80px;
      font-family: Consolas, monospace;
      font-size: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #cbd5e1;
    }

  </style>
</head>


<body>

<div class="container">


  <h1>ESP32 CONTROL</h1>

  <div class="subtitle">
    3 Output MQTT Control
  </div>


  <!-- MQTT STATUS -->

  <div class="card">

    <div class="connection-row">

      <div>

        <div class="label">
          MQTT CONNECTION
        </div>

        <div class="connection">

          <span
            id="connDot"
            class="dot">
          </span>

          <span id="connText">
            Disconnected
          </span>

        </div>

      </div>


      <div style="text-align:right">

        <div class="label">
          DEVICE
        </div>

        <strong>
          ESP01
        </strong>

      </div>

    </div>

  </div>



  <!-- LIGHT 1 -->

  <div class="card">

    <div class="light-title">
      LIGHT 1
    </div>

    <div
      id="status1"
      class="status">
      ---
    </div>


    <div class="buttons">

      <button
        class="btn-on controlButton"
        onclick="sendCommand(1,'ON')"
        disabled>
        ON
      </button>


      <button
        class="btn-off controlButton"
        onclick="sendCommand(1,'OFF')"
        disabled>
        OFF
      </button>

    </div>

  </div>



  <!-- LIGHT 2 -->

  <div class="card">

    <div class="light-title">
      LIGHT 2
    </div>

    <div
      id="status2"
      class="status">
      ---
    </div>


    <div class="buttons">

      <button
        class="btn-on controlButton"
        onclick="sendCommand(2,'ON')"
        disabled>
        ON
      </button>


      <button
        class="btn-off controlButton"
        onclick="sendCommand(2,'OFF')"
        disabled>
        OFF
      </button>

    </div>

  </div>



  <!-- LIGHT 3 -->

  <div class="card">

    <div class="light-title">
      LIGHT 3
    </div>

    <div
      id="status3"
      class="status">
      ---
    </div>


    <div class="buttons">

      <button
        class="btn-on controlButton"
        onclick="sendCommand(3,'ON')"
        disabled>
        ON
      </button>


      <button
        class="btn-off controlButton"
        onclick="sendCommand(3,'OFF')"
        disabled>
        OFF
      </button>

    </div>

  </div>



  <!-- LOGIN -->

  <div class="card">

    <div class="label">
      MQTT LOGIN
    </div>


    <input
      id="username"
      type="text"
      value="esp01"
      placeholder="Username">


    <input
      id="password"
      type="password"
      placeholder="HiveMQ Password">


    <button
      id="connectBtn"
      class="btn-connect"
      onclick="connectMQTT()">
      Connect
    </button>


    <button
      id="disconnectBtn"
      class="btn-disconnect"
      onclick="disconnectMQTT()"
      disabled>
      Disconnect
    </button>

  </div>



  <!-- LOG -->

  <div class="card">

    <div class="label">
      SYSTEM LOG
    </div>

    <div
      id="log"
      class="log">
      Ready.
    </div>

  </div>


</div>



<script>


/* =====================================
   MQTT SERVER
===================================== */

const MQTT_HOST =
"380dfaf330224340913625c3fd2802b8.s1.eu.hivemq.cloud";

const MQTT_PORT = 8884;



/* =====================================
   MQTT TOPICS
===================================== */

const COMMAND_TOPICS = {

  1:
  "factory/esp01/light1/command",

  2:
  "factory/esp01/light2/command",

  3:
  "factory/esp01/light3/command"

};



const STATUS_TOPICS = {

  1:
  "factory/esp01/light1/status",

  2:
  "factory/esp01/light2/status",

  3:
  "factory/esp01/light3/status"

};



/* =====================================
   VARIABLES
===================================== */

let client = null;

let manualDisconnect = false;



/* =====================================
   LOG
===================================== */

function log(message) {

  const time =
    new Date()
    .toLocaleTimeString();


  const logBox =
    document
    .getElementById("log");


  logBox.textContent =
    "[" +
    time +
    "] " +
    message +
    "\n" +
    logBox.textContent;

}



/* =====================================
   MQTT CONNECTION DISPLAY
===================================== */

function setConnection(
  state,
  text
) {

  const dot =
    document
    .getElementById(
      "connDot"
    );


  const label =
    document
    .getElementById(
      "connText"
    );


  dot.className =
    "dot " + state;


  label.textContent =
    text;


  const connected =
    state === "online";


  const buttons =
    document
    .querySelectorAll(
      ".controlButton"
    );


  buttons.forEach(
    function(button) {

      button.disabled =
        !connected;

    }
  );


  document
    .getElementById(
      "connectBtn"
    )
    .disabled =
    connected ||
    state === "connecting";


  document
    .getElementById(
      "disconnectBtn"
    )
    .disabled =
    !connected;

}



/* =====================================
   LIGHT STATUS
===================================== */

function setLightStatus(
  lightNumber,
  message
) {

  const status =
    document
    .getElementById(
      "status" +
      lightNumber
    );


  const msg =
    message
    .trim()
    .toUpperCase();


  status.textContent =
    msg;


  if (
    msg === "ON"
  ) {

    status.className =
      "status on";

  }


  else if (
    msg === "OFF"
  ) {

    status.className =
      "status off";

  }


  else {

    status.className =
      "status";

  }

}



/* =====================================
   CONNECT MQTT
===================================== */

function connectMQTT() {


  const username =
    document
    .getElementById(
      "username"
    )
    .value
    .trim();


  const password =
    document
    .getElementById(
      "password"
    )
    .value;


  if (
    !username ||
    !password
  ) {

    alert(
      "กรุณาใส่ Username และ Password"
    );

    return;

  }



  if (client) {

    try {

      client.end(true);

    }

    catch(e) {

      console.log(e);

    }

    client = null;

  }



  manualDisconnect =
    false;



  setConnection(
    "connecting",
    "Connecting..."
  );



  const url =
    "wss://" +
    MQTT_HOST +
    ":" +
    MQTT_PORT +
    "/mqtt";



  client =
    mqtt.connect(
      url,
      {

        username:
          username,

        password:
          password,


        clientId:
          "ESP32WEB_" +
          Date.now() +
          "_" +
          Math.random()
          .toString(16)
          .slice(2,8),


        clean:
          true,


        keepalive:
          30,


        connectTimeout:
          15000,


        reconnectPeriod:
          5000,


        resubscribe:
          true

      }
    );



  /* CONNECTED */

  client.on(
    "connect",
    function() {


      setConnection(
        "online",
        "Connected"
      );


      log(
        "MQTT Connected"
      );


      client.subscribe(
        STATUS_TOPICS[1]
      );


      client.subscribe(
        STATUS_TOPICS[2]
      );


      client.subscribe(
        STATUS_TOPICS[3]
      );


      log(
        "Subscribed Light 1, 2, 3"
      );

    }
  );



  /* RECEIVE MESSAGE */

  client.on(
    "message",
    function(
      topic,
      payload
    ) {


      const message =
        payload.toString();


      log(
        "RX " +
        topic +
        " : " +
        message
      );



      if (
        topic ===
        STATUS_TOPICS[1]
      ) {

        setLightStatus(
          1,
          message
        );

      }



      else if (
        topic ===
        STATUS_TOPICS[2]
      ) {

        setLightStatus(
          2,
          message
        );

      }



      else if (
        topic ===
        STATUS_TOPICS[3]
      ) {

        setLightStatus(
          3,
          message
        );

      }

    }
  );



  /* RECONNECT */

  client.on(
    "reconnect",
    function() {


      if (
        manualDisconnect
      ) {

        return;

      }


      setConnection(
        "connecting",
        "Reconnecting..."
      );


      log(
        "MQTT Reconnecting..."
      );

    }
  );



  /* OFFLINE */

  client.on(
    "offline",
    function() {


      if (
        manualDisconnect
      ) {

        return;

      }


      setConnection(
        "connecting",
        "Reconnecting..."
      );


      log(
        "MQTT Offline"
      );

    }
  );



  /* CLOSE */

  client.on(
    "close",
    function() {


      if (
        manualDisconnect
      ) {

        return;

      }


      setConnection(
        "connecting",
        "Reconnecting..."
      );

    }
  );



  /* ERROR */

  client.on(
    "error",
    function(error) {


      console.log(
        error
      );


      if (
        manualDisconnect
      ) {

        return;

      }


      setConnection(
        "connecting",
        "Reconnecting..."
      );


      log(
        "MQTT Error: " +
        error.message
      );

    }
  );

}



/* =====================================
   DISCONNECT
===================================== */

function disconnectMQTT() {


  manualDisconnect =
    true;


  if (client) {

    client.end(
      true
    );


    client =
      null;

  }


  setConnection(
    "offline",
    "Disconnected"
  );


  log(
    "Disconnected"
  );

}



/* =====================================
   SEND COMMAND
===================================== */

function sendCommand(
  lightNumber,
  command
) {


  if (
    !client ||
    !client.connected
  ) {

    alert(
      "MQTT ยังไม่ได้เชื่อมต่อ"
    );

    return;

  }


  const topic =
    COMMAND_TOPICS[
      lightNumber
    ];


  client.publish(
    topic,
    command,
    {
      qos: 0,
      retain: false
    },
    function(error) {


      if (error) {

        log(
          "Publish Error: " +
          error.message
        );

      }


      else {

        log(
          "TX Light " +
          lightNumber +
          " : " +
          command
        );

      }

    }
  );

}



/* =====================================
   START
===================================== */

setConnection(
  "offline",
  "Disconnected"
);


</script>


</body>

</html>
